name: Daily Data Backup (manual / standby)

# The daily backup is NOT scheduled here any more.
#
# On 2026-08-06 the scheduled run never executed: GitHub never allocated a
# runner, the job sat queued for 15 minutes and was then cancelled. No logs, no
# backup, and the "fails loudly" check below never got the chance to run — the
# only signal was a "jobs were cancelled" email. A backup that depends on a
# shared runner queue being free at one particular minute is not a backup.
#
# The schedule now lives in Postgres itself (pg_cron + pg_net), which has no
# runner to wait for:
#   daily-backup-primary  17:10 UTC (00:10 Bangkok) -> mkt_run_backup('scheduled')
#   daily-backup-guard-1  18:40 UTC  -> mkt_backup_guard(), re-runs the backup
#   daily-backup-guard-2  20:40 UTC  -> only if no snapshot in the last 20 hours
# The guards are no-ops on a healthy day, so there are never duplicate emails.
#
# This workflow is kept as a manual button: use it to take an extra snapshot on
# demand (before a risky change, say). Equivalent from the SQL editor:
#   select mkt_run_backup('manual');
# and to see recent triggers and their HTTP results:
#   select r.*, h.status_code from mkt_backup_runs r
#     left join net._http_response h on h.id = r.request_id
#     order by r.triggered_at desc limit 20;

on:
  workflow_dispatch:   # Manual trigger only — see note above.

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Take a snapshot via the Supabase Edge Function
        run: |
          for attempt in 1 2 3; do
            RESPONSE=$(curl -s --max-time 300 -o /tmp/backup.json -w "%{http_code}" \
              -X POST \
              "https://fxmigukayxvieziseqil.supabase.co/functions/v1/daily-backup" \
              -H "Content-Type: application/json" \
              -d '{}' || echo "000")

            echo "Attempt $attempt — HTTP Status: $RESPONSE"
            cat /tmp/backup.json 2>/dev/null
            echo

            if [ "$RESPONSE" = "200" ]; then
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "::error::Backup failed with HTTP $RESPONSE after 3 attempts — the team's data was NOT backed up."
              exit 1
            fi

            echo "Retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

          # Fail loudly if the snapshot came back suspiciously empty.
          if grep -q '"mkt_tasks":0' /tmp/backup.json; then
            echo "::error::Backup contained 0 tasks — treating as a failure."
            exit 1
          fi

          echo "::notice::Backup completed successfully."
